name: Build Android APKs

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Resurrection Dex
        uses: actions/checkout@v4
        with:
          path: resurrection-dex

      - name: Check out Pokémon sprite source
        uses: actions/checkout@v4
        with:
          repository: sterling0x1/pokeemerald-expansion
          ref: master
          path: pokeemerald-expansion
          fetch-depth: 1
          sparse-checkout: |
            graphics/pokemon
            src/data/pokemon/species_info
            src/data/pokemon/level_up_learnsets
          sparse-checkout-cone-mode: true

      - name: Package expansion sprites
        run: >-
          python3 resurrection-dex/tools/sync_expansion_sprites.py
          pokeemerald-expansion
          resurrection-dex/app/src/main/assets/sprites

      - name: Package expansion Pokédex descriptions
        run: >-
          python3 resurrection-dex/tools/sync_expansion_descriptions.py
          pokeemerald-expansion
          resurrection-dex/app/src/main/assets/dex_descriptions.json

      - name: Package full expansion profile
        run: >-
          python3 resurrection-dex/tools/sync_expansion_profile.py
          pokeemerald-expansion
          resurrection-dex/app/src/main/assets/expansion_profile.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug and unsigned release APKs
        working-directory: resurrection-dex
        run: gradle --no-daemon clean assembleDebug assembleRelease

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: resurrection-dex-debug
          path: resurrection-dex/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: resurrection-dex-release-unsigned
          path: resurrection-dex/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
